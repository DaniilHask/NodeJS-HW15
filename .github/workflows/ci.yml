name: CI Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build Server
        run: |
          cd app/server
          npm ci
          npm run build

      - name: Install and Build Client
        run: |
          cd app/client/client
          npm ci
          npm run build