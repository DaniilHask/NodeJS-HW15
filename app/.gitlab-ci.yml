stages:
  - build

variables:
  NODE_VERSION: "20"

cache:
  paths:
    - app/server/node_modules/
    - app/client/client/node_modules/

build_server:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - cd app/server
    - npm ci
    - npm run build

build_client:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - cd app/client/client
    - npm ci
    - npm run build