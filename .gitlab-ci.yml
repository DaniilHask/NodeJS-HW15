stages:
  - build
  - deploy

variables:
  NODE_VERSION: "20"

cache:
  paths:
    - app/server/node_modules/
    - app/client/client/node_modules/

# --- ЭТАП 1: CI (Сборка бэкенда и фронтенда) ---
build_server:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - cd app/server
    - npm install
    - npm run build

build_client:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - cd app/client/client
    - npm install
    - npm run build

deploy_to_server:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$SERVER_USER@$SERVER_HOST" "cd /var/www/typeorm_api && git pull origin main && npm install && npm run build && pm2 restart typeorm_api"