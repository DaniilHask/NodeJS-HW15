stages:
  - build

variables:
  NODE_VERSION: "20"

cache:
  paths:
    - server/node_modules/
    - client/client/node_modules/

# Сборка и проверка бэкенда
build_server:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - cd server
    - npm ci
    - npm run build

# Сборка и проверка фронтенда
build_client:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - cd client/client
    - npm ci
    - npm run build